name: Mantener Supabase despierto

on:
  schedule:
    - cron: '0 12 */3 * *' # Cada 3 días a las 12:00 UTC
  workflow_dispatch: # Permite ejecutarlo a mano desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY en GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/keepalive?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
